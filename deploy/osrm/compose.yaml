services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: antarfix-osrm
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --ip
      - 0.0.0.0
      - --port
      - "5000"
      - /data/merauke.osrm
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
